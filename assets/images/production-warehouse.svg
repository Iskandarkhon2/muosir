<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="whBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#whBg)"/>

  <!-- High-Bay Storage Racks Perspective -->
  <g stroke="#334155" stroke-width="4">
    <!-- Vertical Posts -->
    <line x1="80" y1="60" x2="80" y2="400"/>
    <line x1="220" y1="60" x2="220" y2="400"/>
    <line x1="360" y1="60" x2="360" y2="400"/>
    <line x1="500" y1="60" x2="500" y2="400"/>
    <line x1="640" y1="60" x2="640" y2="400"/>
    <line x1="720" y1="60" x2="720" y2="400"/>

    <!-- Horizontal Shelf Beams (Orange/Blue) -->
    <line x1="60" y1="120" x2="740" y2="120" stroke="#0066FF"/>
    <line x1="60" y1="210" x2="740" y2="210" stroke="#F59E0B"/>
    <line x1="60" y1="300" x2="740" y2="300" stroke="#0066FF"/>
    <line x1="60" y1="390" x2="740" y2="390" stroke="#F59E0B"/>
  </g>

  <!-- Euro Pallets with Boxes Wrapped in Film -->
  <!-- Level 1 -->
  <g fill="url(#boxGrad)" stroke="#B45309" stroke-width="1.5">
    <!-- Bay 1 -->
    <rect x="95" y="315" width="110" height="70" rx="3"/>
    <rect x="95" y="225" width="110" height="70" rx="3"/>
    <rect x="95" y="135" width="110" height="70" rx="3"/>

    <!-- Bay 2 -->
    <rect x="235" y="315" width="110" height="70" rx="3"/>
    <rect x="235" y="225" width="110" height="70" rx="3"/>
    <rect x="235" y="135" width="110" height="70" rx="3"/>

    <!-- Bay 3 -->
    <rect x="375" y="315" width="110" height="70" rx="3"/>
    <rect x="375" y="225" width="110" height="70" rx="3"/>
    <rect x="375" y="135" width="110" height="70" rx="3"/>

    <!-- Bay 4 -->
    <rect x="515" y="315" width="110" height="70" rx="3"/>
    <rect x="515" y="225" width="110" height="70" rx="3"/>
    <rect x="515" y="135" width="110" height="70" rx="3"/>
  </g>

  <!-- Pallet Bases (Wooden Runners) -->
  <g fill="#78350F">
    <rect x="95" y="385" width="110" height="5"/>
    <rect x="235" y="385" width="110" height="5"/>
    <rect x="375" y="385" width="110" height="5"/>
    <rect x="515" y="385" width="110" height="5"/>
    <rect x="95" y="295" width="110" height="5"/>
    <rect x="235" y="295" width="110" height="5"/>
    <rect x="375" y="295" width="110" height="5"/>
    <rect x="515" y="295" width="110" height="5"/>
  </g>

  <!-- Pallet Stretch Film Reflection (Glassy Cyan sheen) -->
  <g fill="#38BDF8" fill-opacity="0.12">
    <rect x="95" y="315" width="110" height="70"/>
    <rect x="235" y="315" width="110" height="70"/>
    <rect x="375" y="315" width="110" height="70"/>
    <rect x="515" y="315" width="110" height="70"/>
  </g>

  <!-- Electric Forklift in Foreground -->
  <g transform="translate(620, 310)">
    <!-- Chassis -->
    <rect x="15" y="40" width="75" height="40" rx="6" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="28" cy="80" r="10" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="75" cy="80" r="10" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <!-- Mast & Forks -->
    <rect x="5" y="0" width="6" height="80" fill="#334155"/>
    <rect x="0" y="30" width="20" height="4" fill="#64748B"/>
    <!-- Cabin Frame -->
    <path d="M40 40 L45 10 L70 10 L75 40" stroke="#00D2FF" stroke-width="2" fill="none"/>
    <circle cx="58" cy="22" r="5" fill="#F8FAFC"/>
  </g>

  <!-- Bottom Info Bar -->
  <rect x="50" y="415" width="700" height="60" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="80" y="440" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">СКЛАДСКОЙ КОМПЛЕКС И РЕЗЕРВ ГОТОВОЙ ТАРЫ</text>
  <text x="80" y="458" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Буферный склад 3 000+ м²: отгрузка популярных позиций в течение 24–48 часов</text>
  <rect x="635" y="427" width="95" height="28" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
  <text x="682" y="445" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">В НАЛИЧИИ</text>
</svg>
