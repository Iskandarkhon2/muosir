<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071120"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mapBg)"/>

  <!-- Stylized Geographic Grid -->
  <g stroke="#0066FF" stroke-opacity="0.1" stroke-width="1">
    <line x1="50" y1="50" x2="750" y2="50"/>
    <line x1="50" y1="150" x2="750" y2="150"/>
    <line x1="50" y1="250" x2="750" y2="250"/>
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="400"/>
    <line x1="300" y1="50" x2="300" y2="400"/>
    <line x1="450" y1="50" x2="450" y2="400"/>
    <line x1="600" y1="50" x2="600" y2="400"/>
  </g>

  <!-- Central Production Hub: Khujand -->
  <!-- Radiating Export Pulse Circles -->
  <circle cx="360" cy="270" r="45" stroke="#00D2FF" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="360" cy="270" r="90" stroke="#00D2FF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="360" cy="270" r="140" stroke="#00D2FF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Delivery Route Lines with dashed animated style -->
  <!-- Route 1: Khujand -> Tashkent (150 km) -->
  <path d="M360 270 Q370 230 380 200" stroke="#00D2FF" stroke-width="3" stroke-dasharray="6 3"/>
  <!-- Route 2: Khujand -> Samarkand (280 km) -->
  <path d="M360 270 Q300 260 250 250" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- Route 3: Khujand -> Almaty (850 km) -->
  <path d="M360 270 Q480 180 580 140" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- Route 4: Khujand -> Bishkek (580 km) -->
  <path d="M360 270 Q460 210 520 180" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- Route 5: Khujand -> Dushanbe (300 km) -->
  <path d="M360 270 Q340 310 330 350" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- Route 6: Khujand -> Russia / Moscow -->
  <path d="M360 270 Q280 150 180 90" stroke="#818CF8" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- City Nodes -->
  <!-- Khujand (HQ) -->
  <g transform="translate(360, 270)">
    <circle cx="0" cy="0" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <rect x="-70" y="18" width="140" height="34" rx="6" fill="#0F172A" stroke="#00D2FF"/>
    <text x="0" y="33" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">ХУДЖАНД (ЗАВОД)</text>
    <text x="0" y="46" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Муосир пласт HQ</text>
  </g>

  <!-- Tashkent -->
  <g transform="translate(380, 195)">
    <circle cx="0" cy="0" r="8" fill="#10B981" stroke="#34D399" stroke-width="2"/>
    <rect x="15" y="-12" width="130" height="26" rx="5" fill="#0B132B" stroke="#1E293B"/>
    <text x="25" y="4" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Ташкент · 1 день</text>
  </g>

  <!-- Samarkand -->
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="7" fill="#10B981" stroke="#34D399" stroke-width="2"/>
    <rect x="-140" y="-12" width="130" height="26" rx="5" fill="#0B132B" stroke="#1E293B"/>
    <text x="-130" y="4" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Самарканд · 1.5 дня</text>
  </g>

  <!-- Almaty -->
  <g transform="translate(580, 140)">
    <circle cx="0" cy="0" r="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="-12" width="130" height="26" rx="5" fill="#0B132B" stroke="#1E293B"/>
    <text x="25" y="4" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Алматы · 3 дня</text>
  </g>

  <!-- Bishkek -->
  <g transform="translate(520, 180)">
    <circle cx="0" cy="0" r="7" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="-12" width="130" height="26" rx="5" fill="#0B132B" stroke="#1E293B"/>
    <text x="25" y="4" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Бишкек · 2 дня</text>
  </g>

  <!-- Dushanbe -->
  <g transform="translate(330, 350)">
    <circle cx="0" cy="0" r="7" fill="#F59E0B" stroke="#FBBF24" stroke-width="2"/>
    <rect x="15" y="-12" width="130" height="26" rx="5" fill="#0B132B" stroke="#1E293B"/>
    <text x="25" y="4" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Душанбе · 1 день</text>
  </g>

  <!-- Moscow / EAEU -->
  <g transform="translate(180, 90)">
    <circle cx="0" cy="0" r="7" fill="#818CF8" stroke="#A5B4FC" stroke-width="2"/>
    <rect x="-140" y="-12" width="130" height="26" rx="5" fill="#0B132B" stroke="#1E293B"/>
    <text x="-130" y="4" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">РФ / ЕАЭС · СТ-1</text>
  </g>
</svg>
