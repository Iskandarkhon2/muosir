<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="qcBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#qcBg)"/>

  <!-- Lab Workstation Base -->
  <rect x="60" y="280" width="680" height="110" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="80" y="260" width="640" height="20" fill="#334155"/>

  <!-- Instrument 1: Digital Optical Wall-Thickness Scanner -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="160" height="160" rx="8" fill="#0B132B" stroke="#00D2FF" stroke-width="2"/>
    <circle cx="80" cy="70" r="45" fill="#030712" stroke="#0284C7" stroke-dasharray="4 2"/>
    <!-- Crosshairs -->
    <line x1="80" y1="20" x2="80" y2="120" stroke="#00D2FF" stroke-width="1"/>
    <line x1="30" y1="70" x2="130" y2="70" stroke="#00D2FF" stroke-width="1"/>
    <!-- Measured Sample Contour -->
    <path d="M55 55 L105 55 L95 95 L65 95 Z" stroke="#38BDF8" stroke-width="2" fill="#0066FF" fill-opacity="0.2"/>
    <text x="80" y="145" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ТОЛЩИНА: 0.52 мм ±0.01</text>
  </g>

  <!-- Instrument 2: Vacuum Leak & Burst Seal Tester -->
  <g transform="translate(320, 80)">
    <!-- Vacuum Bell Jar -->
    <path d="M30 180 L30 60 C30 20, 130 20, 130 60 L130 180 Z" fill="#0284C7" fill-opacity="0.1" stroke="#38BDF8" stroke-width="2"/>
    <rect x="20" y="180" width="120" height="15" rx="3" fill="#1E293B" stroke="#64748B"/>
    <!-- Testing Cup inside -->
    <path d="M55 110 L105 110 L98 165 L62 165 Z" fill="#F8FAFC" stroke="#CBD5E1"/>
    <!-- Aluminum Foil Seal on Top -->
    <line x1="50" y1="110" x2="110" y2="110" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Pressure Gauge -->
    <circle cx="80" cy="-10" r="28" fill="#0B132B" stroke="#00D2FF" stroke-width="2"/>
    <line x1="80" y1="-10" x2="95" y2="-22" stroke="#EF4444" stroke-width="2"/>
    <text x="80" y="3" fill="#38BDF8" font-family="monospace" font-size="8" text-anchor="middle">-0.85 bar</text>
    <text x="80" y="215" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Тест на герметичность запайки</text>
  </g>

  <!-- Instrument 3: Top-Load Compression & Stacking Rig -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="160" height="160" rx="8" fill="#0B132B" stroke="#0066FF" stroke-width="2"/>
    <!-- Hydraulic Press Platen -->
    <rect x="30" y="20" width="100" height="15" fill="#475569" stroke="#94A3B8"/>
    <line x1="80" y1="0" x2="80" y2="20" stroke="#38BDF8" stroke-width="6"/>
    <!-- Stack of Containers Tested -->
    <rect x="45" y="45" width="70" height="25" rx="3" fill="#F8FAFC" stroke="#94A3B8"/>
    <rect x="45" y="75" width="70" height="25" rx="3" fill="#F8FAFC" stroke="#94A3B8"/>
    <rect x="45" y="105" width="70" height="25" rx="3" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="80" y="145" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">НАГРУЗКА: 480 N (OK)</text>
  </g>

  <!-- Bottom Quality Assurance Guarantee -->
  <rect x="60" y="415" width="680" height="60" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="90" y="440" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">ЛАБОРАТОРНЫЙ КОНТРОЛЬ ОТК ПО СТАНДАРТУ ISO 9001</text>
  <text x="90" y="458" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Каждая серия тары проверяется на разрушающее усилие, термостойкость и отсутствие миграции веществ</text>
  <rect x="625" y="427" width="95" height="28" rx="6" fill="#0066FF" fill-opacity="0.2" stroke="#0066FF"/>
  <text x="672" y="445" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">100% ОТК</text>
</svg>
