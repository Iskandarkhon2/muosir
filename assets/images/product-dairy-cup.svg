<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" fill="none">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <rect width="400" height="320" rx="16" fill="#0B132B"/>
  <circle cx="200" cy="160" r="110" fill="#0066FF" fill-opacity="0.1" filter="blur(30px)"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="275" rx="85" ry="16" fill="url(#shadowG)"/>
  
  <!-- Cup Body -->
  <path d="M120 95 L145 255 Q150 265 165 265 L235 265 Q250 265 255 255 L280 95 Z" fill="url(#cupGrad)" stroke="#94A3B8" stroke-width="1.5"/>
  
  <!-- Flange / Sealing Rim -->
  <ellipse cx="200" cy="95" rx="84" ry="16" fill="url(#rimGrad)" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="200" cy="95" rx="76" ry="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Packaging Details & Spec label -->
  <path d="M140 130 C170 145 230 145 260 130" stroke="#0066FF" stroke-width="2.5" stroke-dasharray="4,4"/>
  <rect x="155" y="160" width="90" height="50" rx="6" fill="#0066FF" fill-opacity="0.15" stroke="#00D2FF" stroke-width="1.5"/>
  <text x="200" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#00D2FF" text-anchor="middle">PP В· Г 95 mm</text>
  <text x="200" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">400 ml</text>
  
  <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">FOOD GRADE VIRGIN PP</text>
</svg>